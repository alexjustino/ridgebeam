<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    Ridgebeam's mark: a gable — two rafters meeting at the apex — with the ridge beam drawn as the
    one solid piece at the top. The beam is the product; the rafters are what it holds together.
    Ink on a rounded plate so the icon reads at 16 px in the taskbar and in the rail.
  -->
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f5f8b"/>
      <stop offset="1" stop-color="#123c5a"/>
    </linearGradient>
  </defs>
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#plate)"/>
  <!-- rafters -->
  <path d="M96 392 L256 176 L416 392" fill="none" stroke="#dbe9f4" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- collar tie -->
  <path d="M170 292 L342 292" fill="none" stroke="#dbe9f4" stroke-width="28" stroke-linecap="round"/>
  <!-- the ridge beam: the one solid piece -->
  <rect x="196" y="120" width="120" height="56" rx="16" fill="#f6c453"/>
</svg>
