[package]
name = "ridgebeam"
version = "0.1.0"
description = "A works planner: the plan is intent, the diary is fact, and the plan says what it does not yet know"
authors = ["Alex Justino"]
license = "Apache-2.0"
repository = "https://github.com/alexjustino/ridgebeam"
edition = "2021"
# `image` 0.25.10 declares 1.88 (F4). The crate cannot build on less.
rust-version = "1.88"

[lib]
# The `_lib` suffix keeps the library name distinct from the binary on Windows.
name = "ridgebeam_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.40", features = ["bundled"] }
log = "0.4"
uuid = { version = "1", features = ["v7"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# The diary (F4). An entry carries the SHA-256 of its canonical form and of the
# entry before it; a photo is stored under the SHA-256 of its bytes.
sha2 = "0.10"
hex = "0.4"
# A thumbnail reaches the screen as a `data:` URL: the interface is never handed
# a path, and there is no asset protocol and no filesystem permission.
base64 = "0.22"
# Photos are hostile files. Default features off: only the five formats a photo
# may arrive as are compiled in, each a decoder reachable from a file, and every
# one is used under `image::Limits` after the header has been read and capped
# (SECURITY.md, "Files are hostile"). JPEG is also the thumbnail's encoder, and
# the encoder of a photo printed in a report (D3, `report::images`).
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp"] }
# Opening a photo with the operating system's own handler, on a click. Used as a
# Rust library only (`open_path`): the plugin is not registered, so it adds no
# command the webview could call and no capability.
tauri-plugin-opener = "2"
# Reports (F10): the host lays a document out and writes it as a PDF in the
# standard Helvetica faces, WinAnsi, nothing embedded (`report::pdf`). The same
# writer as the sibling product's export; it writes, it never reads a PDF.
pdf-writer = "0.15"
# A report's page streams are deflated (`/FlateDecode`). Already in the tree
# through `png` (F4, where it was a dev-dependency for the hostile corpus);
# naming it here makes the host a direct user and adds no crate to the binary.
flate2 = "1"

[dev-dependencies]
# The second reader (F10, ADR-031): every PDF a test writes is parsed by a
# library of another lineage than the writer, and its text, pages and metadata
# read back. Tests only — the product never parses a PDF (F7: a PDF is kept by
# its bytes). No default features: `chrono-clock` and `rayon` add nothing to
# reading one small file. 0.45 declares rust-version 1.88, as this crate does.
lopdf = { version = "0.45", default-features = false }

[target.'cfg(windows)'.dependencies]
# The accent colour the desktop uses, read from the system (`os::accent`).
# The accent colour (`os::accent`), and the account's display name, which signs
# a diary entry (`os::account`) — the product has no accounts of its own.
windows = { version = "0.58", features = [
    "UI_ViewManagement",
    "Foundation",
    "Win32_Foundation",
    "Win32_Security_Authentication_Identity",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# Licences of the direct dependencies, for NOTICE. Every one is a permissive
# licence compatible with this product's Apache-2.0; none is copyleft.
#
#   tauri, tauri-build            Apache-2.0 OR MIT
#   tauri-plugin-dialog           Apache-2.0 OR MIT
#   tauri-plugin-log              Apache-2.0 OR MIT
#   serde, serde_json             MIT OR Apache-2.0
#   thiserror                     MIT OR Apache-2.0
#   rusqlite                      MIT  (the bundled SQLite itself is public domain)
#   log                           MIT OR Apache-2.0
#   uuid                          Apache-2.0 OR MIT
#   chrono                        MIT OR Apache-2.0
#   windows                       MIT OR Apache-2.0
#
# F4 (the diary and its photos) adds five, and pulls in these on Windows
# (read from `cargo metadata`, normal dependencies only; `png`, `flate2`,
# `crc32fast`, `miniz_oxide` and `fdeflate` were already in the tree through
# tauri). None is copyleft:
#   sha2                          MIT OR Apache-2.0
#   hex                           MIT OR Apache-2.0
#   base64                        MIT OR Apache-2.0
#   image                         MIT OR Apache-2.0
#     └ zune-jpeg, zune-core      MIT OR Apache-2.0 OR Zlib   (jpeg)
#     └ png                       MIT OR Apache-2.0           (png)
#     └ gif, weezl                MIT OR Apache-2.0           (gif)
#     └ color_quant               MIT                         (gif)
#     └ image-webp                MIT OR Apache-2.0           (webp)
#     └ quick-error               MIT OR Apache-2.0           (webp)
#     └ moxcms, pxfm              BSD-3-Clause OR Apache-2.0  (colour profiles)
#     └ bytemuck                  Zlib OR Apache-2.0 OR MIT
#     └ byteorder-lite            Unlicense OR MIT
#     (bmp needs no crate of its own)
#   tauri-plugin-opener           Apache-2.0 OR MIT
#     └ open                      MIT
#
# F10 (reports) adds two crates to the binary — pdf-writer and, through it
# alone, ryu — and makes one it already carried a direct dependency (read from
# `cargo tree -e normal`). None is copyleft:
#   pdf-writer                    MIT OR Apache-2.0
#     └ ryu                       Apache-2.0 OR BSL-1.0   (new with pdf-writer)
#     └ bitflags, itoa, memchr    (already in the tree)
#   flate2                        MIT OR Apache-2.0       (already in the tree)
# and one for tests only, never in the binary:
#   lopdf (dev)                   MIT
# F11 (backup and restore) adds no crate. A backup is a ZIP written and read
# by hand (`files::archive`: store and deflate, through `flate2`, already here).
# The `zip` crate was measured — 8.6.0 (MIT, rust-version 1.88) with only
# `deflate-flate2` would add `zip` and `typed-path` (MIT OR Apache-2.0) — and
# not taken: see the module's own reasons.
#
# D3 (the handover book) adds no crate and no feature: a photo in a report is
# decoded and re-encoded by `image` with the features above, and embedded as
# `/DCTDecode` by `pdf-writer`; the JPEG marker walk that drops a photo's
# metadata is this crate's own (`report::images`).
#
# D4 (the owner's snapshot) adds no crate and no feature: the page is written
# by hand (`report::html`), its photos re-encoded by `image` and written into it
# with `base64`, both already here; its SVG is checked in tests by a structural
# walk, not by an XML crate.
#
# The widths of Helvetica and Helvetica-Bold (`report::winansi`) are numbers
# from Adobe's Core14 AFM files, whose notice is carried in that module and in
# NOTICE. No font file is embedded or shipped.
#
# There is no HTTP client, no filesystem plugin and no shell plugin in this
# list, on purpose: the product makes no network request and runs no program
# (SECURITY.md). A dependency added here says why, in a comment beside it.
